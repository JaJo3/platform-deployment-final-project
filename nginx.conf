upstream php_upstream {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Deny access to hidden dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Handle static asset delivery and caching efficiently
    location ~* ^.+\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt|woff|woff2|ttf|svg)$ {
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Forward all clean URLs straight to index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Securely pass PHP traffic to the co-located PHP-FPM process
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param APP_ENV prod;
        fastcgi_param APP_DEBUG 0;
        
        # Internal directive blocks public execution of underlying files
        internal;
    }

    # Fallback to catch alternative direct php requests
    location ~ \.php$ {
        return 404;
    }

    # Hard boundary restrictions against core frameworks structural assets
    location ~ ^/(config|src|var|vendor|migrations)/ {
        deny all;
    }
}